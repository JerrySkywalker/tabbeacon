[package]
name = "tabbeacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Live identity and status beacons for coding-agent tabs in Windows Terminal."
repository = "https://github.com/JerrySkywalker/tabbeacon"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tabbeacon"
path = "src/main.rs"

[[bin]]
name = "tabbeacon-visual-fixture"
path = "src/bin/tabbeacon-visual-fixture.rs"

[dependencies]
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.0"
win-screenshot = "4.0.14"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
