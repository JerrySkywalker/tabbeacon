[package]
name = "tabbeacon"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Live identity and status beacons for coding-agent tabs in Windows Terminal."
repository = "https://github.com/JerrySkywalker/tabbeacon"
readme = "README.md"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tabbeacon"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
