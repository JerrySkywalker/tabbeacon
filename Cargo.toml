[package]
name = "tabbeacon"
version = "0.7.2"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
description = "Live identity and status beacons for coding-agent tabs in Windows Terminal."
repository = "https://github.com/JerrySkywalker/tabbeacon"
readme = "README.md"
keywords = ["terminal", "cli", "windows-terminal", "codex", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "rust-toolchain.toml",
    "rustfmt.toml",
    "src/**",
    "tests/**",
    "scripts/generate-promo-assets.ps1",
    "scripts/run-windows-terminal-tui-smoke.ps1",
    "scripts/invoke-windows-terminal-tui-smoke-child.ps1",
    "scripts/compare-codex-compatibility.ps1",
    ".github/workflows/visual-ci.yml",
    ".github/workflows/release-dangling-symlink.yml",
    "docs/codex-hooks.md",
    "docs/agy-setup.md",
    "docs/adr/0015-agy-1-1-19-production-profile.md",
    "docs/assets/brand/tabbeacon-logo.svg",
    "docs/assets/brand/tabbeacon-mark-monochrome.svg",
    "docs/assets/brand/tabbeacon-mark.svg",
    "docs/assets/brand/tabbeacon-state-strip.svg",
    "docs/assets/screenshots/tabbeacon-overview.png",
    "docs/v0.6-release-notes.md",
    "docs/v0.6-upgrade.md",
    "docs/v0.6.1-release-notes.md",
    "docs/v0.6.1-upgrade.md",
    "docs/v0.7.0-release-notes.md",
    "docs/v0.7.0-upgrade.md",
    "docs/v0.7.1-release-notes.md",
    "docs/v0.7.1-upgrade.md",
    "docs/v0.7.2-release-notes.md",
    "docs/v0.7.2-upgrade.md",
    "AGENTS.md",
    "dev_governance_files/ROADMAP.md",
    "dev_governance_files/QUALITY_GATES.md",
]

[features]
visual-fixture = []
terminal-smoke-fixture = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "tabbeacon"
path = "src/main.rs"

[[bin]]
name = "tabbeacon-visual-fixture"
path = "src/bin/tabbeacon-visual-fixture.rs"
required-features = ["visual-fixture"]

[[bin]]
name = "tabbeacon-terminal-smoke-fixture"
path = "src/bin/tabbeacon-terminal-smoke-fixture.rs"
required-features = ["terminal-smoke-fixture"]

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.5.60", features = ["derive"] }
clap_complete = "4.5.66"
crossterm = "0.28.1"
terminal-ui-contract = "=0.1.0"
dialoguer = "0.12.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
ratatui = "0.29.0"
toml_edit = "0.25.13"
unicode-width = "0.2.0"
unicode-segmentation = "1.13.3"
unicode-normalization = "0.1.25"

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.0"
win-screenshot = "4.0.14"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[lints.rust]
# Reviewed Windows Unicode-title and atomic-replace calls are locally allowed;
# all other unsafe code remains denied.
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Hook invocation is a Windows process-start-sensitive path. Keep release
# artifacts compact without changing panic semantics or the debug/test profile.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
