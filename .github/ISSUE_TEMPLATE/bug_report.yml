name: Bug report
description: Report a reproducible problem with TabBeacon.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a reproducible problem. Please include only the smallest amount of information needed to reproduce it.

        Do **not** post credentials or tokens, prompts, assistant content, tool input/output, private repository contents, unnecessary private full paths, raw Hook payloads containing sensitive data, or unredacted environment/process dumps.
  - type: textarea
    id: description
    attributes:
      label: Concise bug description
      description: What happened? Keep this focused on the observable problem.
      placeholder: A short description of the problem.
    validations:
      required: true
  - type: input
    id: tabbeacon-version
    attributes:
      label: TabBeacon version
      description: For example, v0.7.3. If unknown, say so.
    validations:
      required: true
  - type: dropdown
    id: installation-method
    attributes:
      label: Installation method
      options:
        - crates.io / cargo install
        - GitHub release asset
        - Built from source
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: coding-agent
    attributes:
      label: Coding agent
      options:
        - Codex CLI
        - Agy CLI
        - Other / not sure
    validations:
      required: true
  - type: input
    id: coding-agent-version
    attributes:
      label: Coding-agent version
      description: If unknown, write `not sure`.
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: For example, Windows 11 24H2.
    validations:
      required: true
  - type: input
    id: windows-terminal-version
    attributes:
      label: Windows Terminal version
      description: If unknown, write `not sure`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence. Redact private details.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: fail-open
    attributes:
      label: Did coding-agent use itself remain functional (fail-open)?
      description: TabBeacon should not prevent the underlying coding agent from being usable.
      options:
        - "Yes, the coding agent remained usable"
        - "No, the coding agent was not usable"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Sanitized `tabbeacon doctor` information (optional)
      description: Include only relevant, redacted lines. Do not attach raw environment or process dumps.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (optional)
      description: Drag in screenshots only after removing private content, prompts, paths, and tokens.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy acknowledgment
      options:
        - label: I removed sensitive and unnecessary private information from this report.
          required: true
