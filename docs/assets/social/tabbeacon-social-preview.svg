<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">TabBeacon for coding-agent tabs in Windows Terminal</title>
  <desc id="desc">A TabBeacon-owned social preview with a concise value statement and three synthetic terminal tab states.</desc>
