  <text x="332" y="165" fill="#80C7FF" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="7">TABBEACON</text>
  <text x="100" y="296" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">Know what your coding-agent tabs</text>
  <text x="100" y="367" fill="#F5FAFF" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700">are doing — at a glance.</text>
  <text x="103" y="421" fill="#A9BED8" font-family="Segoe UI, Arial, sans-serif" font-size="26">Live identity and status in Windows Terminal, without changing how you launch.</text>
